<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contrato — Jogo Stealth</title>
<style>
:root{--bg:#14161b;--ink:#e8e6e1;--mut:#9a9ca3;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-size:15px;text-shadow:0 1px 3px #000}
#hud b{color:#fff}
#bar{width:120px;height:8px;background:#0006;border:1px solid #fff4;display:inline-block;vertical-align:middle}
#bar i{display:block;height:100%;background:#d94040;width:100%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;text-align:center;padding:20px}
#ov div{max-width:460px}
#ov h1{font-size:44px;margin:0 0 6px;letter-spacing:1px}
#ov p{margin:6px 0;color:var(--mut);line-height:1.5}
#ov .go{margin-top:18px;color:#fff;font-size:18px}
@media (prefers-color-scheme:light){:root{--bg:#14161b}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="obj"></div><div id="st"></div></div>
<div id="ov"><div id="ovc"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=40,W=54,H=38;
const OC={agent:'#000000',civil:'#3b82f6',civilw:'#f2f2f2',staff:'#22c55e',guard:'#f59e0b',target:'#e03131'};
const LOC=['Passagem','Cidade','Fábrica','Balada'];
const NAMES={agent:'terno preto',civil:'azul de civil',civilw:'branca de civil',staff:'verde de funcionário',guard:'laranja de guarda',target:'vermelha do alvo'};
let grid,rooms,hides,th,tf,dk,pal,zn,G,mouse={x:0,y:0},keys={},state='menu',last=0;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1));
function resize(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',resize);resize();

function gen(){
  grid=Array.from({length:H},()=>Array(W).fill(1));rooms=[];
  for(let i=0;i<300&&rooms.length<12;i++){
    const w=RI(5,10),h=RI(5,9),x=RI(2,W-w-2),y=RI(2,H-h-2);
    if(rooms.some(r=>x-2<r.x+r.w&&x+w+2>r.x&&y-2<r.y+r.h&&y+h+2>r.y))continue;
    rooms.push({x,y,w,h,cx:Math.floor(x+w/2),cy:Math.floor(y+h/2)});
    for(let j=y;j<y+h;j++)for(let k=x;k<x+w;k++)grid[j][k]=0;
  }
  const cut=(x,y)=>{if(x>0&&y>0&&x<W-1&&y<H-1)grid[y][x]=0};
  const link=(a,b)=>{let x=a.cx,y=a.cy;
    while(x!=b.cx){cut(x,y);cut(x,y+1);x+=Math.sign(b.cx-x)}
    while(y!=b.cy){cut(x,y);cut(x+1,y);y+=Math.sign(b.cy-y)}};
  for(let i=1;i<rooms.length;i++)link(rooms[i-1],rooms[i]);
  for(let i=0;i<4;i++)link(rooms[RI(0,rooms.length-1)],rooms[RI(0,rooms.length-1)]);
  hides=[];
  const free=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(grid[y+j][x+i]>1)return false;return true};
  const put=(x,y,v,t)=>{grid[y][x]=v;hides.push({x:(x+.5)*T,y:(y+.5)*T,t,body:null})};
  rooms.forEach(r=>{
    const a=RI(1,2),b=RI(1,2);
    for(let k=0;k<a;k++){const x=RI(r.x,r.x+r.w-1),y=r.y;
      if(grid[y][x]===0&&grid[y-1][x]===1&&x!=r.cx&&x!=r.cx+1&&free(x,y))put(x,y,2,'locker')}
    for(let k=0;k<b;k++){const x=RI(r.x+1,r.x+r.w-2),y=RI(r.y+1,r.y+r.h-2);
      if(grid[y][x]===0&&x!=r.cx&&y!=r.cy&&free(x,y))put(x,y,3,'crate')}});
  const MT=RI(1,3),hue=RI(0,359);
  th=Array.from({length:H},()=>Array(W).fill(MT));tf=Array.from({length:H},()=>Array(W).fill(''));dk=Array.from({length:H},()=>Array(W).fill(''));
  const WP={1:[['#4a3a36','#7a5a4c'],['#3f4048','#6c6f7a'],['#4b4538','#7d7358']],2:[['#2b2f35','#58606b'],['#33322a','#6b684f'],['#252c2c','#4d6060']]};
  pal={hue,w:MT==3?['hsl('+hue+',45%,11%)','hsl('+hue+',85%,50%)']:WP[MT][RI(0,2)]};
  const rm=Array.from({length:H},()=>Array(W).fill(false));
  rooms.forEach(r=>{r.th=MT;for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)rm[y][x]=true});
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(grid[y][x]===0){
    const room=rm[y][x],p=room?[0,.3,.12,.45][MT]:[0,.12,.25,.5][MT];
    if(Math.random()<p)tf[y][x]=room?['','g','h','n'][MT]:['','c','h','n'][MT]}
  const KD={1:['tree','tree','bush','bench','fountain','car','lamp','lamp'],2:['machine','machine','barrel','barrel','tank','pallet','pallet'],3:['speaker','table','table','bar','couch','couch']};
  rooms.forEach(r=>{
    if(MT==2&&Math.random()<.8){const by=RI(r.y+1,r.y+r.h-2);for(let x=r.x+1;x<r.x+r.w-1;x++)if(grid[by][x]===0)tf[by][x]='b'}
    const cells=[];
    for(let y=r.y+1;y<r.y+r.h-1;y++)for(let x=r.x+1;x<r.x+r.w-1;x++)if(grid[y][x]===0)cells.push([x,y]);
    cells.sort(()=>Math.random()-.5);
    let n=RI(3,7);
    for(const [x,y] of cells){if(n<=0)break;
      if(x==r.cx||x==r.cx+1||y==r.cy||y==r.cy+1||!free(x,y))continue;
      const a=KD[MT];grid[y][x]=4;dk[y][x]=a[RI(0,a.length-1)];n--}
  });
  zn=Array.from({length:H},()=>Array(W).fill(0));
  const cand=rooms.slice(1).sort(()=>Math.random()-.5),cnt=Math.min(cand.length,RI(2,3));
  for(let k=0;k<cnt;k++){const r=cand[k];r.zone=k==0?2:RI(1,2);
    for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)zn[y][x]=r.zone}
}
const okOutfit=(o,lv)=>!lv||(lv==1?(o=='staff'||o=='guard'):o=='guard');
function nearestExit(x,y){
  const sx=Math.floor(x/T),sy=Math.floor(y/T),seen=new Set([sy*W+sx]),q=[[sx,sy]];
  while(q.length){const [cx,cy]=q.shift();
    if(!zn[cy][cx]||okOutfit(G.p.outfit,zn[cy][cx]))return{x:(cx+.5)*T,y:(cy+.5)*T};
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+d[0],ny=cy+d[1];
      if(nx<0||ny<0||nx>=W||ny>=H||grid[ny][nx]||seen.has(ny*W+nx))continue;seen.add(ny*W+nx);q.push([nx,ny])}}
  return{x,y}}
const solid=(x,y)=>{const tx=Math.floor(x/T),ty=Math.floor(y/T);return tx<0||ty<0||tx>=W||ty>=H||grid[ty][tx]!==0};
const hit=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
function mv(e,dx,dy){if(!hit(e.x+dx,e.y,e.r))e.x+=dx;if(!hit(e.x,e.y+dy,e.r))e.y+=dy}
function los(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.ceil(d/8);
  for(let i=1;i<n;i++){if(solid(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n))return false}return true}
function bfs(sx,sy,ex,ey){
  const s=[Math.floor(sx/T),Math.floor(sy/T)],e=[Math.floor(ex/T),Math.floor(ey/T)];
  const prev=new Map(),q=[s],k=p=>p[1]*W+p[0];prev.set(k(s),null);
  while(q.length){const c=q.shift();if(c[0]==e[0]&&c[1]==e[1])break;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[c[0]+d[0],c[1]+d[1]];
      if(n[0]<0||n[1]<0||n[0]>=W||n[1]>=H||grid[n[1]][n[0]]||prev.has(k(n)))continue;prev.set(k(n),c);q.push(n)}}
  if(!prev.has(k(e)))return[];
  const path=[];let c=e;while(c&&!(c[0]==s[0]&&c[1]==s[1])){path.unshift({x:c[0]*T+T/2,y:c[1]*T+T/2});c=prev.get(k(c))}
  return path;
}
function floorPos(t){let x,y;do{const r=rooms[RI(0,rooms.length-1)];x=RI(r.x+1,r.x+r.w-2);y=RI(r.y+1,r.y+r.h-2)}while(grid[y][x]!==0||(t&&!okOutfit(t=='target'?'guard':t,zn[y][x])));return{x:(x+.5)*T,y:(y+.5)*T}}

function newGame(){
  gen();
  const s=rooms[0],p={x:(s.cx+.5)*T,y:(s.cy+.5)*T,r:10,hp:100,ang:0,wp:0,cd:0,crime:0,carry:null,armed:false,outfit:'agent',chg:null};
  G={p,ex:{x:p.x,y:p.y},npcs:[],fx:[],drops:[],clothes:[],ammo:10,done:false,alarm:false,cam:{x:0,y:0},msg:'',msgT:0,t:0};
  const add=(type,n,color)=>{for(let i=0;i<n;i++){let q,t=0;do{q=floorPos(type);t++}while(Math.hypot(q.x-p.x,q.y-p.y)<(type=='target'?700:260)&&t<80);
    G.npcs.push({type,color,outfit:type,mem:new Set(),x:q.x,y:q.y,r:type=='target'?11:10,ang:R(0,6.28),path:[],wait:R(0,2),dead:false,mode:'walk',timer:0,seen:false,cd:0,last:null,rp:0})}};
  add('target',1,'#e03131');add('civil',10,'#3b82f6');add('civilw',9,'#f2f2f2');add('staff',3,'#22c55e');add('guard',5,'#f59e0b');
  G.alarmGuards=(m=false)=>{G.alarm=true;G.npcs.forEach(n=>{if(n.type=='guard'&&!n.dead){if(m)n.mem.add(G.p.outfit);n.mode='alert';n.timer=10;n.last={x:G.p.x,y:G.p.y};n.path=bfs(n.x,n.y,G.p.x,G.p.y)}})};
  msg('Elimine o alvo vermelho.',4);
}
function msg(t,s){G.msg=t;G.msgT=s}
function sees(n,tg,range,cone){const dx=tg.x-n.x,dy=tg.y-n.y,d=Math.hypot(dx,dy);if(d>range)return false;
  if(cone){let a=Math.atan2(dy,dx)-n.ang;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)>cone)return false}
  return los(n,tg)}
function follow(e,spd,dt){if(!e.path.length)return false;const t=e.path[0],dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);
  if(d<5){e.path.shift();return true}
  const ta=Math.atan2(dy,dx);let da=ta-e.ang;da=Math.atan2(Math.sin(da),Math.cos(da));e.ang+=da*Math.min(1,dt*10);
  mv(e,dx/d*spd*dt,dy/d*spd*dt);return true}
function kill(n){n.dead=true;if(n.type=='guard')G.drops.push({x:n.x,y:n.y,n:RI(1,3)});if(n.type=='target'){G.done=true;msg('Alvo eliminado. Vá até a zona de extração verde.',6)}}
function witnesses(victim){let w=false;G.p.crime=.8;
  G.npcs.forEach(n=>{if(n.dead||n===victim)return;if(sees(n,G.p,280,0.95)){w=true;n.mem.add(G.p.outfit);
    if(n.type=='guard'){n.mode='alert';n.timer=10;n.last={x:G.p.x,y:G.p.y}}else{n.mode='flee';n.timer=6;n.path=bfs(n.x,n.y,...Object.values(floorPos(n.type)))}}});
  if(w){G.alarmGuards(true);msg('Você foi visto! Guardas em alerta.',3)}}
const CHG=4;
function swap(){
  if(state!='play')return;const p=G.p;if(p.carry||p.run||p.chg)return;
  let best=null,bd=46;
  const pick=(k,r,x,y)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best={k,r}}};
  G.npcs.forEach(n=>{if(n.dead&&!n.hidden)pick('body',n,n.x,n.y)});
  hides.forEach(h=>{if(h.body)pick('body',h.body,h.x,h.y)});
  G.clothes.forEach(c=>pick('cloth',c,c.x,c.y));
  if(!best){msg('Chegue perto de um corpo, de um esconderijo com corpo ou de roupas no chão.',2.5);return}
  if(best.k=='body'&&best.r.type.startsWith('civil')){msg('Roupas de civil não podem ser trocadas.',3);return}
  if(best.k=='body'&&best.r.swapped){msg('Esse corpo já foi despido: não há disfarce nele.',3);return}
  p.armed=false;p.chg={t:CHG,d:CHG,src:best,to:best.r.outfit,from:p.outfit};
  msg('Trocando de roupa... você está vulnerável!',CHG)}
function finishSwap(){
  const p=G.p,s=p.chg.src,r=s.r,old=p.outfit;p.chg=null;
  if(s.k=='cloth'){if(!G.clothes.includes(r))return;p.outfit=r.outfit;r.outfit=old}
  else{p.outfit=r.outfit;r.outfit='none';r.color='#9a9a9a';r.swapped=true;G.clothes.push({x:p.x,y:p.y,outfit:old})}
  msg('Pronto: agora você veste '+NAMES[p.outfit]+'. A anterior ficou no chão.'+(p.outfit=='guard'?' Armas não levantam suspeita com essa roupa.':''),4)}
function interact(){
  if(state!='play')return;const p=G.p;if(p.chg)return;
  if(p.carry){const near=hides.filter(h=>Math.hypot(h.x-p.x,h.y-p.y)<46),h=near.find(h=>!h.body),b=p.carry;
    if(!h&&near.length){msg('Esse esconderijo já está ocupado.',2);return}
    p.carry=null;b.carried=false;
    if(h){h.body=b;b.hidden=true;msg('Corpo escondido no '+(h.t=='locker'?'armário':'caixote')+'.',2.5)}else msg('Corpo largado.',1.5)}
  else{let v=null,bd=44;G.npcs.forEach(n=>{if(n.dead&&!n.hidden){const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<bd){bd=d;v=n}}});
    if(v){p.carry=v;v.carried=true;p.armed=false;msg('Carregando corpo. Aperte E perto de um armário ou caixa para esconder.',3.5)}}
}
function act(){
  const p=G.p;if(p.cd>0||state!='play')return;
  if(p.chg)return;
  if(p.carry){msg('Solte o corpo (E) para atacar.',1.5);return}
  if(p.run){msg('Não dá para usar itens correndo.',1.5);return}
  if(!p.armed){p.armed=true;p.cd=.25;msg('Arma sacada.',1.2);return}
  if(p.wp==0){
    if(G.ammo<=0){msg('Sem munição.',1.5);return}
    G.ammo--;p.cd=.35;const dx=Math.cos(p.ang),dy=Math.sin(p.ang);let x=p.x,y=p.y,v=null;
    for(let i=0;i<150;i++){x+=dx*4;y+=dy*4;if(solid(x,y))break;
      v=G.npcs.find(n=>!n.dead&&Math.hypot(n.x-x,n.y-y)<n.r+2);if(v)break}
    G.fx.push({a:{x:p.x,y:p.y},b:{x,y},t:.15,c:'#fff8'});
    if(v){kill(v);witnesses(v)}else witnesses(null);
  }else{
    p.cd=.7;let v=null,bd=48;
    G.npcs.forEach(n=>{if(n.dead)return;const d=Math.hypot(n.x-p.x,n.y-p.y);
      let a=Math.atan2(n.y-p.y,n.x-p.x)-p.ang;a=Math.atan2(Math.sin(a),Math.cos(a));
      if(d<bd&&Math.abs(a)<1.3&&los(p,n)){bd=d;v=n}});
    G.fx.push({a:{x:p.x,y:p.y},b:{x:p.x+Math.cos(p.ang)*44,y:p.y+Math.sin(p.ang)*44},t:.2,c:'#ddd',w:3});
    if(v){kill(v);witnesses(v);p.carry=v;v.carried=true;p.armed=false;if(v.type!='target')msg('Corpo em mãos. E para esconder em armário/caixa ou largar.',3.5)}
  }
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(G&&state=='play'&&!G.p.carry&&!G.p.chg){const p=G.p;if(k=='1'){p.wp=0;p.armed=true}if(k=='2'){p.wp=1;p.armed=true}if(k=='q'){p.wp^=1;p.armed=true}if(k=='f')p.armed=!p.armed}
  if(k=='c')swap();
  if(k=='e')interact();
  if(k=='r'){newGame();show(null);state='play'}});
addEventListener('blur',()=>{keys={}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
addEventListener('wheel',()=>{if(G&&state=='play'&&!G.p.carry&&!G.p.chg){G.p.wp^=1;G.p.armed=true}});
addEventListener('mousedown',e=>{
  if(state=='menu'||state=='win'||state=='lose'){newGame();show(null);state='play';return}
  act()});

function update(dt){
  const p=G.p;G.t+=dt;p.cd-=dt;p.crime-=dt;G.msgT-=dt;
  let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);
  if(p.chg){dx=0;dy=0;p.chg.t-=dt;if(p.chg.t<=0)finishSwap()}
  p.run=!!(keys.shift&&(dx||dy)&&!p.carry);
  if(dx||dy){const l=Math.hypot(dx,dy),sp=p.carry?90:p.run?250:150;mv(p,dx/l*sp*dt,dy/l*sp*dt)}
  {const lv=zn[Math.floor(p.y/T)][Math.floor(p.x/T)];p.bad=!!lv&&!okOutfit(p.outfit,lv);
   if(p.bad&&!p.wasBad)msg('Área restrita! Sua roupa não é permitida aqui.',3.5);p.wasBad=p.bad}
  G.cam.x=p.x-cv.width/2;G.cam.y=p.y-cv.height/2;
  p.ang=Math.atan2(mouse.y+G.cam.y-p.y,mouse.x+G.cam.x-p.x);
  if(p.carry){p.carry.x=p.x-Math.cos(p.ang)*14;p.carry.y=p.y-Math.sin(p.ang)*14}
  G.drops=G.drops.filter(d=>{if(Math.hypot(d.x-p.x,d.y-p.y)<22){G.ammo+=d.n;msg('+'+d.n+' munição',2);return false}return true});
  G.fx.forEach(f=>f.t-=dt);G.fx=G.fx.filter(f=>f.t>0);
  G.npcs.forEach(n=>{
    if(n.dead)return;
    if(n.mode=='flee'){n.timer-=dt;if(!n.path.length){const q=floorPos(n.type);n.path=bfs(n.x,n.y,q.x,q.y)}follow(n,115,dt);if(n.timer<=0)n.mode='walk';return}
    if(n.mode=='escort'){
      const lv=zn[Math.floor(p.y/T)][Math.floor(p.x/T)];
      if(!lv||okOutfit(p.outfit,lv)){n.mode='walk';n.path=[];n.leading=false;return}
      n.est+=dt;const d=Math.hypot(p.x-n.x,p.y-n.y);
      if(!n.leading){n.rp-=dt;if(n.rp<=0){n.rp=.4;n.path=bfs(n.x,n.y,p.x,p.y)}follow(n,120,dt);
        if(d<70){n.leading=true;n.path=bfs(n.x,n.y,n.exit.x,n.exit.y);msg('Guarda: área proibida! Siga-me para fora.',3.5)}}
      else if(d<170)follow(n,75,dt);
      if(n.est>14){n.mode='alert';n.timer=10;n.last={x:p.x,y:p.y};n.mem.add(p.outfit);n.rp=0;n.leading=false;G.alarm=true;msg('O guarda perdeu a paciência e vai atacar!',3)}
      return}
    if(n.mode=='report'){
      let g=null,bd=1e9;G.npcs.forEach(m=>{if(m.type=='guard'&&!m.dead){const d=Math.hypot(m.x-n.x,m.y-n.y);if(d<bd){bd=d;g=m}}});
      if(!g||(n.body&&n.body.hidden)){n.mode='walk';n.path=[];return}
      n.rp-=dt;if(n.rp<=0){n.rp=.5;n.path=bfs(n.x,n.y,g.x,g.y)}
      follow(n,120,dt);
      if(bd<36){const b=n.body||n.lastP;if(n.body)n.body.seen=true;G.alarm=true;
        G.npcs.forEach(m=>{if(m.type=='guard'&&!m.dead&&Math.hypot(m.x-g.x,m.y-g.y)<380){m.mode='alert';m.timer=10;m.last={x:b.x,y:b.y};m.rp=0;m.path=bfs(m.x,m.y,b.x,b.y);if(n.rep)n.rep.forEach(o=>m.mem.add(o))}});
